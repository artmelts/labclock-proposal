<meta name="theme-color" content="#f3f6f5">
<title>LabClock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f6f5; --card:#fff; --ink:#1c2a28; --muted:#5d6d6a; --accent:#0f766e; --line:#dde5e3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Rubik", system-ui, sans-serif; font-size: 17px; line-height: 1.5; }
  .wrap { max-width: 420px; margin: 0 auto; min-height: 100vh; padding: 64px 16px 32px; text-align: center; }
  .brand { font-weight: 600; font-size: 20px; direction: ltr; }
  .brand span { color: var(--accent); }
  h1 { font-weight: 600; font-size: 26px; margin: 40px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  input[type=password] { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--card); font: inherit; color: var(--ink); text-align: center; direction: ltr; }
  input[type=password]:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; min-height: 52px; margin-top: 12px; border: none; border-radius: 14px;
    background: var(--ink); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  label { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 14px;
    font-size: 15px; color: var(--muted); }
  label input { width: 18px; height: 18px; accent-color: var(--accent); }
  .err { color: #a2463a; min-height: 24px; margin-top: 12px; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Lab<span>Clock</span></div>
  <h1>עמוד פרטי</h1>
  <p>נא להקליד את הסיסמה שארטיום שלח לך.</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" placeholder="סיסמה" autofocus>
    <button type="submit">לפתוח</button>
    <label><input type="checkbox" id="remember" checked> לזכור בטלפון הזה</label>
    <div class="err" id="err"></div>
  </form>
</div>

const ITERATIONS = 310000;
const KEY = 'labclock-proposal-pw';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: ITERATIONS, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

async function tryOpen(password, remember) {
  try {
    const html = await unlock(password);
    try { remember ? localStorage.setItem(KEY, password) : localStorage.removeItem(KEY); } catch (e) {}
    show(html);
    return true;
  } catch (e) {
    return false;
  }
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err');
  err.textContent = 'פותח…';
  const ok = await tryOpen(document.getElementById('pw').value.trim(), document.getElementById('remember').checked);
  if (!ok) err.textContent = 'הסיסמה לא נכונה. אפשר לנסות שוב.';
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && !(await tryOpen(saved, true))) {
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
})();
})();
